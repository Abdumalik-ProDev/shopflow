[project]
name = "shopflow-ml"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "mlflow>=2.11.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
